<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turret · Step 흐름</title>
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #d9d7cf;
  --edge: #8f8d85; --fail: #c2412d;
  --ok: #2f7d4f; --ok-bg: #e3f1e8; --run: #2b5fb4; --run-bg: #e3ebf8;
  --bad: #c2412d; --bad-bg: #f8e4df; --wait: #8a8880; --wait-bg: #eceae4;
  --g: #6b4bb8; --g-bg: #ece6f7; --p: #9a6a12; --p-bg: #f5ecd9; --i: #1f7a7a; --i-bg: #ddf0ef;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161614; --surface: #20201d; --ink: #ecebe6; --muted: #a09e96; --line: #3a3934;
    --edge: #77756d; --fail: #ec7a63;
    --ok: #7fcf9c; --ok-bg: #1f3428; --run: #8db3f0; --run-bg: #1f2a3d;
    --bad: #ec7a63; --bad-bg: #3d2420; --wait: #a09e96; --wait-bg: #2c2b27;
    --g: #b8a2ec; --g-bg: #2e2640; --p: #e0b45e; --p-bg: #3a2f1a; --i: #74c8c8; --i-bg: #1c3434;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
header { padding: 20px 24px 8px; }
h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.01em; }
.sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.legend .label { font-size: 12px; color: var(--muted); margin-right: 2px; }
.chip { display: inline-flex; gap: 4px; align-items: center; border: 1px solid transparent;
  border-radius: 999px; padding: 2px 9px; font-size: 12px; cursor: pointer; background: none; color: inherit; font-family: inherit; }
.chip b { font-weight: 700; }
.chip.G { background: var(--g-bg); color: var(--g); }
.chip.P { background: var(--p-bg); color: var(--p); }
.chip.I { background: var(--i-bg); color: var(--i); }
.chip.on { border-color: currentColor; }
.chip .warn { color: var(--bad); }
.tools { display: flex; gap: 8px; margin: 12px 0 0; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px;
  padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer; }
.keys { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 10px; }
.keys span { display: inline-flex; align-items: center; gap: 6px; }
.keys i { display: inline-block; width: 22px; height: 0; border-top: 2px solid var(--edge); }
.keys i.f { border-top: 2px dashed var(--fail); }

#board { position: relative; overflow: auto; padding: 0 24px 32px; }
#edges { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
#lanes { position: relative; display: flex; gap: 52px; padding: 64px 0 64px; width: max-content; min-width: 100%; }
.lane { display: flex; flex-direction: column; gap: 18px; justify-content: center; }

.card { width: 220px; text-align: left; background: var(--surface); color: inherit; border: 1px solid var(--line);
  border-radius: 12px; padding: 12px 13px; box-shadow: var(--shadow); cursor: pointer; font: inherit;
  transition: opacity .15s, transform .15s, border-color .15s; position: relative; z-index: 1; }
.card:hover { transform: translateY(-1px); border-color: var(--edge); }
.card:focus-visible { outline: 2px solid var(--run); outline-offset: 2px; }
.card.dim { opacity: .28; }
.card.sel { border-color: var(--ink); }
.card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card .id { font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.card .title { font-size: 15px; font-weight: 650; margin: 2px 0 6px; line-height: 1.35; }
.card .exit { font-size: 12.5px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 8px; margin-bottom: 8px; }
.card .refs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 9px; }
.card .refs .chip { cursor: default; padding: 0 7px; font-size: 11px; }
.status { display: flex; gap: 8px; align-items: center; font-size: 12px; }
.pill { border-radius: 6px; padding: 1px 7px; font-weight: 600; }
.pill.통과 { background: var(--ok-bg); color: var(--ok); }
.pill.진행 { background: var(--run-bg); color: var(--run); }
.pill.미통과 { background: var(--bad-bg); color: var(--bad); }
.pill.대기 { background: var(--wait-bg); color: var(--wait); }

path.e { fill: none; stroke: var(--edge); stroke-width: 1.6; transition: opacity .15s; }
path.f { fill: none; stroke: var(--fail); stroke-width: 1.4; stroke-dasharray: 5 4; transition: opacity .15s; }
text.fl { fill: var(--fail); font-size: 11px; }
.dimE { opacity: .15; }

#panel { position: fixed; top: 0; right: 0; height: 100%; width: min(460px, 100%); background: var(--surface);
  border-left: 1px solid var(--line); box-shadow: -8px 0 30px rgba(0,0,0,.12); transform: translateX(105%);
  transition: transform .22s ease, visibility 0s .22s; visibility: hidden; z-index: 10; display: flex; flex-direction: column; }
#panel.open { transform: none; visibility: visible; transition: transform .22s ease; }
#panel .ph { display: flex; justify-content: space-between; align-items: start; gap: 12px; padding: 16px 18px 10px; border-bottom: 1px solid var(--line); }
#panel .ph h2 { margin: 0; font-size: 17px; }
#panel .ph .id { font-size: 12px; color: var(--muted); font-weight: 700; }
#panel .pb { overflow: auto; padding: 12px 18px 28px; }
#panel .meta { display: grid; grid-template-columns: 74px 1fr; gap: 5px 10px; font-size: 13px; margin-bottom: 10px; }
#panel .meta dt { color: var(--muted); }
#panel .meta dd { margin: 0; }
#panel .src { font-size: 12.5px; color: var(--muted); }
#panel .src a { color: var(--run); }
#panel .md h2 { font-size: 15px; margin: 18px 0 6px; }
#panel .md h3 { font-size: 14px; margin: 16px 0 4px; }
#panel .md table { border-collapse: collapse; width: 100%; font-size: 12.5px; margin: 6px 0; display: block; overflow-x: auto; }
#panel .md th, #panel .md td { border: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
#panel .md th { background: var(--bg); }
#panel .md blockquote { margin: 8px 0; padding: 6px 10px; border-left: 3px solid var(--edge); color: var(--muted); background: var(--bg); }
#panel .md code { font-size: 12px; background: var(--bg); padding: 1px 4px; border-radius: 4px; }
#panel .md p, #panel .md li { font-size: 13.5px; }
.x { border: 0; background: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); padding: 0 4px; }
#scrim { position: fixed; inset: 0; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 9; }
#scrim.open { opacity: 1; pointer-events: auto; }

/* 좁은 화면: 위→아래 흐름, 패널은 아래에서 올라오는 시트 */
@media (max-width: 760px) {
  header { padding: 16px 16px 6px; }
  #board { padding: 0 16px 28px; }
  #lanes { flex-direction: column; gap: 40px; padding: 12px 34px 8px 44px; width: auto; }
  .lane { flex-direction: row; gap: 10px; }
  .card { width: 100%; }
  .lane.multi .card { flex: 1 1 0; min-width: 0; padding: 10px; }
  .lane.multi .card .title { font-size: 14px; }
  .lane.multi .card .exit { font-size: 11.5px; }
  .lane.multi .status { flex-wrap: wrap; row-gap: 6px; }
  #panel { top: auto; bottom: 0; height: 82vh; width: 100%; border-left: 0; border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0; transform: translateY(105%); }
}
</style>
</head>
<body>
<header>
  <h1 id="ttl"></h1>
  <p class="sub">원본은 <code>Steps/*.md</code>와 <code>problem.md</code>. 이 파일은 <code>tools/gen_flow.py</code>가 만든다. 카드를 누르면 Step 문서가 열린다.</p>
  <div class="legend" id="legend"></div>
  <div class="tools"><button class="btn" id="openProblem">problem.md 보기</button></div>
  <div class="keys"><span><i></i>선행 Step</span><span><i class="f"></i>기준 미달 시 돌아갈 곳</span></div>
</header>
<div id="board"><svg id="edges"></svg><div id="lanes"></div></div>
<div id="scrim"></div>

  <div class="ph"><div><div class="id" id="pId"></div><h2 id="pTitle"></h2></div><button class="x" id="close" aria-label="닫기">×</button></div>

</aside>
<script type="application/json" id="data">{"project": "Turret", "refs": {"G1": {"group": "goals", "text": "지정 단일 음원(재생음) 조건에서 3마이크 지속음 방위: 유효 출력 절대오차 중앙값 ≤ 5°, p95 ≤ 10°, 평가 구간 유효율 ≥ 80%"}, "G2": {"group": "goals", "text": "고정 연속 검증 조건에서 드론 분류: 독립 드론 사건 ≥ 30건, 사건 검출률 ≥ 90%, 비드론 ≥ 2시간에서 오탐 ≤ 1회/시간, 확정 지연 p95 ≤ 1 s"}, "G3": {"group": "goals", "text": "판정·방위 결합: 드론 존재 평가 시점의 ≥ 80%에 검출과 정답 방위 ±10° 이내 유효 출력을 함께 제공 (0.25 s마다 없음 / 드론, θ° / 판단 불가)"}, "G4": {"group": "goals", "text": "STM32 + PC 실시간 통합: 전체 부하 30분 정상 운용에서 ADC/DMA 유실·OVR 0, 처리 지연 누적 없음"}, "G5": {"group": "goals", "text": "(조건부) 실제 소형 고정익(또는 같은 급 대용 기체) 비행에서 G1·G2 기준 충족 — 실기와 독립 정답 자료를 확보했을 때만"}, "P1": {"group": "priorities", "text": "첫 완성의 필수 Step(5 ~ 8, 9A, 10)이 선택 확장(서보, SBC, 카메라, 접근 판별, MCU 단독 분류)보다 먼저다"}, "P2": {"group": "priorities", "text": "검증된 라이브러리(CMSIS-DSP FIR·FFT)를 손구현보다 먼저 쓴다. 직접 구현은 수집·버퍼·통신·상태 관리·실시간 통합에 집중한다"}, "P3": {"group": "priorities", "text": "학습 분류의 가능성 확인이 혼합음 해결보다 먼저다. 혼합음 대응을 기다리지 않고 통합한다"}, "P4": {"group": "priorities", "text": "알고리즘은 PC에서 먼저 만들어서 검증하고(정답지), MCU는 같은 입력으로 PC와 비교해 이식한다"}, "I1": {"group": "invariants", "text": "누락 구간을 정상 연속 신호처럼 이어 붙이지 않는다 (번호 건너뜀·OVR → 필터 재시작, RESYNC·GAP 표시)"}, "I2": {"group": "invariants", "text": "split은 원본·사건 단위로 먼저 나누고 창을 자른다. 최종 시험셋은 모델·임계값 선택에 쓰지 않는다"}, "I3": {"group": "invariants", "text": "같은 디지털 입력에서 MCU와 PC 결과가 일치한다 (전처리 ≤ 2 LSB, 방향 지연·각도 차이 기준). 한쪽 상수를 바꾸면 반대쪽도 같이 바꾼다"}, "I4": {"group": "invariants", "text": "오래된 관측·유실 입력·무효 방위를 정상 관측으로 쓰지 않는다"}, "I5": {"group": "invariants", "text": "재생음·대용 음원 조건의 결과를 실제 고정익·다른 기체·다른 환경의 성능으로 주장하지 않는다"}}, "problem_body": "<blockquote>\n<p>초안 — 사용자 확인 필요. G·P·I는 기존 Roadmap v0.5 (<code>FPV_Target<\/code> 브랜치 <code>Steps/step/Step4.5.2_Roadmap_축소.md<\/code>) 1절 \"첫 완성 목표와 범위\", 3절 통과 기준, 6절 판정·기록 원칙에서 옮겼다. 수치는 원문의 \"초기 제안값\"이다.<\/p>\n<\/blockquote>\n<h1>문제 정의<\/h1>\n<h2>한 줄 요약<\/h2>\n<p>정해진 재생음 조건에서 STM32가 마이크 3개로 연속 수음·전처리·방향 추정을 하고, PC의 학습 기반 드론 분류 결과를 시간에 맞춰 결합한다. 유실·오래된 관측·오류 복귀를 처리하고 검출률·오탐·방위 오차·실시간 처리 결과를 제시한다.<\/p>\n<p><strong>대상 (2026-10-27, <a href=\"decision.html#D4-3\">D4-3<\/a>):<\/strong> 북한 침투형 급 소형 고정익 정찰 무인기 (날개폭 2 ~ 3 m, 소형 가솔린 엔진, 2022년 침범 기체는 고도 약 3 km · 시속 약 100 km). 설치형 지역 방위, 기존 하드웨어(STM32F446 + MAX4466 3개)만, 저가 임베디드 제품.<\/p>\n<h2>비목표<\/h2>\n<ul>\n<li>고조파만으로 드론 확정, 고조파 검출을 통과해야 학습 모델을 실행하는 게이트<\/li>\n<li>FIR/FFT 손구현, 모든 비교 알고리즘(SRP-PHAT 등)의 의무 구현<\/li>\n<li>혼합음 대응 성능을 첫 완성의 필수 조건으로 두는 것 (Step9B는 한계 기록만 필수)<\/li>\n<li>대형 무인기(샛별급), 마이크 쪽 하드웨어 추가(마이크 추가·고성능 마이크). PC는 나중에 라즈베리파이·젯슨이 대신하고 카메라도 거기서 돌린다 (선택 확장 \"SBC 이식\")<\/li>\n<li>선택 확장 (진입 조건이 생기면 Step으로 세운다)<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>선택 확장<\/th>\n<th>진입 조건<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>기본 서보 지향<\/td>\n<td>Step9A·10 이후. 재생음으로 PWM·영점·회전 부호·기구 범위·오래된 명령 제외·구동 중 관측 처리·정지 후 복귀. 실제 카메라 영상 확보와 분리<\/td>\n<\/tr>\n<tr>\n<td>SBC 이식<\/td>\n<td>PC 구성의 성능이 확인되고 독립 운용이 필요할 때. 같은 입력의 출력과 Step10 마감을 다시 검증<\/td>\n<\/tr>\n<tr>\n<td>Step12 접근 판별<\/td>\n<td>실제 거리 변화 정답과 제자리 스로틀 반례가 있을 때<\/td>\n<\/tr>\n<tr>\n<td>Step13 카메라 영상 확보<\/td>\n<td>기본 서보와 별도. 실비행·카메라 확보 후 영상 확보율과 지연 검증<\/td>\n<\/tr>\n<tr>\n<td>Step14 MCU 단독 분류<\/td>\n<td>모델 성능·RAM·Flash·처리 예산 확인 후. CNN14(수백 MB)는 불가, 작은 모델(int8, 수십 KB)을 따로 검토<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>파츠 등급<\/h2>\n<p>등급은 <strong>얼마나 깊이 숙지해야 하는가<\/strong>다. 누가 코드를 쓰는지가 아니다. 구현은 등급과 관계없이 AI가 빠르게 진행한다 (learning/GUIDE.md 1절 \"빠른 구현은 포기하지 않는다\").<\/p>\n<ul>\n<li><strong>구현<\/strong>: 실무에서 핵심인 부분. 문서와 AI 없이 직접 구현할 수 있을 만큼 숙지한다 → 트리거 점검에서 복원·고장 진단 문항을 우선한다<\/li>\n<li><strong>설명<\/strong>: 원리와 파라미터의 역할·현재 값의 근거를 설명할 수 있으면 된다<\/li>\n<li><strong>블랙박스<\/strong>: 입력 전처리와 출력의 의미만 이해한다<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>파츠<\/th>\n<th>등급<\/th>\n<th>이유<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ADC·DMA 수집, 링버퍼·송신 큐, 패킷·CRC, 유실 처리<\/td>\n<td>구현<\/td>\n<td>개발 지침 P2: 직접 구현은 수집·버퍼·통신·상태 관리에 집중<\/td>\n<\/tr>\n<tr>\n<td>판정·방위 결합 (Step9A), 실시간 통합 (Step10)<\/td>\n<td>구현<\/td>\n<td>카메라가 받는 결과가 이것 하나라 동작을 직접 책임져야 한다<\/td>\n<\/tr>\n<tr>\n<td>GCC-PHAT·LSE·배경 빼기 (doa.c)<\/td>\n<td>설명<\/td>\n<td>원리와 파라미터를 설명할 수 있어야 한다<\/td>\n<\/tr>\n<tr>\n<td>FIR 데시메이션 (CMSIS <code>arm_fir_decimate_f32<\/code>), FFT<\/td>\n<td>설명<\/td>\n<td>라이브러리 사용. 계수 설계·상태 처리 규칙은 설명 대상<\/td>\n<\/tr>\n<tr>\n<td>CNN14 임베딩<\/td>\n<td>블랙박스<\/td>\n<td>사전학습 모델. 입력 전처리와 점수의 의미만 이해한다<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>열린 결정 (사용자)<\/h2>\n<ul>\n<li>목표 탐지 거리 — 대상이 고정익으로 바뀌어 다시 정한다. FPV(1 m 80 dBA) 기준 추정은 교외 낮 방향 약 16 m, 분류 약 10 m였다 (<a href=\"decision.html#DO-1\">DO-1<\/a>)<\/li>\n<li>확정 지연 기준 ≤ 1 s 유지 여부 — 현재 창 설계로는 최소 1.5 s (<a href=\"decision.html#DO-2\">DO-2<\/a>)<\/li>\n<li>장치 음압 보정 측정 (휴대폰 소음계로 dBFS ↔ dB SPL 한 번). 탐지 거리 추정의 가장 큰 미지수 → <a href=\"Steps/Step8d.md\">Step8d<\/a><\/li>\n<\/ul>\n<h2>변경 이력<\/h2>\n<ul>\n<li>2026-10-14 · Roadmap 4.5(v0.2): 계획서 P0 ~ P9를 Step5 ~ 14로 분할<\/li>\n<li>2026-10-15 · Roadmap 4.5.2 v0.4: 학습 분류를 주 경로로 복원, 고조파 검출기는 비교용 B0로. 첫 구성 STM32 + PC<\/li>\n<li>2026-10-18 · Roadmap v0.5: Step9A를 \"판정·방위 결합\"으로 풀어 씀. 9A는 정답 타임라인으로 먼저 검증<\/li>\n<li>2026-10-22 · 문서 구조 개편으로 problem.md 신설 (초안)<\/li>\n<li>2026-10-27 · 대상을 FPV형 멀티로터에서 소형 고정익 정찰 무인기로 변경 (D4-3). 기존 하드웨어만, 저가 임베디드 제품<\/li>\n<\/ul>", "steps": [{"id": "Step1", "title": "3채널 ADC-DMA 더블 버퍼링과 마이크 신호 확인", "depends_on": [], "goal_ref": ["G1", "G4"], "exit": "(사후 정리) 3개 마이크를 동시 샘플링해 DMA 핑퐁 버퍼로 끊김 없이 받고, STM32CubeMonitor로 각 마이크의 정상 출력을 확인", "on_fail": null, "status": {"impl": "통과"}, "body": "<h2>질문과 답<\/h2>\n<p><strong>Q.<\/strong> 마이크 3개를 같은 순간에, 일정한 간격으로, 끊김 없이 잴 수 있는가?<\/p>\n<p><strong>A. 예.<\/strong> ADC1 ~ 3 삼중 동시 변환(TIM2 50 kHz 트리거)과 DMA 핑퐁으로 <code>drop_cnt<\/code> 0, 각 채널 바이어스 약 2048·조용할 때 p2p 50 ~ 100을 확인했다. 실제 샘플링 속도와 채널 간 전기적 동시성은 재지 않았다.<\/p>\n<h2>최종 목표와의 연결<\/h2>\n<ul>\n<li>G1: 방향은 세 채널의 도달 시간차(µs 단위)로 구하므로 동시 변환과 일정한 간격이 전제다.<\/li>\n<li>G4: 핑퐁 버퍼의 마감(반버퍼 20.48 ms)이 이후 모든 실시간 처리 예산의 기준이다.<\/li>\n<\/ul>\n<h2>통과 기준 (확정일 기록 없음 — 원문 \"이 단계의 목표\"를 사후에 옮김)<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>기준<\/th>\n<th>측정 조건<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>동시 샘플링<\/td>\n<td>ADC1 ~ 3 삼중 동시 변환, TIM2 트리거<\/td>\n<td>설정 확인<\/td>\n<\/tr>\n<tr>\n<td>끊김 없는 수집<\/td>\n<td>핑퐁 버퍼, <code>dropCnt<\/code> 0<\/td>\n<td>통계 계산만 하는 부하<\/td>\n<\/tr>\n<tr>\n<td>마이크 출력<\/td>\n<td>각 채널 바이어스·잡음 바닥 정상<\/td>\n<td>CubeMonitor 통계 그래프<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>결과<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>실측<\/th>\n<th>판정<\/th>\n<th>날짜<\/th>\n<th>근거<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>채널 0 경로 (TIM2→ADC→DMA→이중버퍼)<\/td>\n<td>mean ≈ 2048, 조용할 때 p2p ≈ 50 ~ 100, drop_cnt = 0<\/td>\n<td>통과<\/td>\n<td>2026-10-08<\/td>\n<td><a href=\"../reports/step1/CubeMonitor1.png\">CubeMonitor1<\/a>, <a href=\"../reports/step1/CubeMonitor2.png\">CubeMonitor2<\/a><\/td>\n<\/tr>\n<tr>\n<td>큰 소리<\/td>\n<td>p2p ≈ 4000 ~ 4095 (클리핑) → 모듈 게인 낮춤<\/td>\n<td>해결<\/td>\n<td>2026-10-08<\/td>\n<td>이전 판 5절<\/td>\n<\/tr>\n<tr>\n<td>채널 매핑<\/td>\n<td>마이크 하나씩 두드려 확인<\/td>\n<td>통과<\/td>\n<td>2026-10-08<\/td>\n<td>이전 판 6절<\/td>\n<\/tr>\n<tr>\n<td>실제 샘플링 속도, 프레임 주기 흔들림, 채널 간 동시성(전기), 25 kHz 위 잡음<\/td>\n<td>—<\/td>\n<td>미측정<\/td>\n<td>—<\/td>\n<td>이전 판 5.1절<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>파라미터<\/h2>\n<table>\n<thead>\n<tr>\n<th>이름<\/th>\n<th>현재 값<\/th>\n<th>근거<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>샘플링<\/td>\n<td>50 kHz (TIM2 PSC 0, ARR 1799)<\/td>\n<td><a href=\"../decision.html#D1-2\">D1-2<\/a><\/td>\n<\/tr>\n<tr>\n<td>프레임<\/td>\n<td>1024샘플 = 20.48 ms<\/td>\n<td>D1-2<\/td>\n<\/tr>\n<tr>\n<td>ADC 변환<\/td>\n<td>28 + 12 cycles ≈ 1.78 µs<\/td>\n<td><a href=\"../docs/firmware.html#clock\">docs/firmware.html<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>클럭 트리와 ADC·DMA 설정은 <a href=\"../docs/firmware.html#clock\">docs/firmware.html<\/a>에 있다.<\/p>\n<h2>남은 일<\/h2>\n<ul>\n<li>없음. 미측정 항목은 <a href=\"../decision.html#D4.5-5\">D4.5-5<\/a>(하드웨어 점검 Step 생략)로 넘어갔고, 프레임 주기 흔들림은 <a href=\"Step10.md\">Step10<\/a>에서 잰다.<\/li>\n<\/ul>\n<h2>관련 결정<\/h2>\n<ul>\n<li>D1-1, D1-2 (decision.html)<\/li>\n<\/ul>", "file": "Steps/Step1.md", "level": 0}, {"id": "Step2", "title": "UART 프레임 덤프·캡처와 3채널 원파형 확인", "depends_on": ["Step1"], "goal_ref": ["G1", "G4"], "exit": "(사후 정리) 샘플 단위(20 µs) 원파형을 PC로 가져와 3채널을 겹쳐 보고 클리핑·게인 균형·도달 시간차를 확인, GCC-PHAT 입력(npz) 확보", "on_fail": null, "status": {"impl": "통과"}, "body": "<h2>질문과 답<\/h2>\n<p><strong>Q.<\/strong> 연속 전송이 안 되는 UART(약 92 KB/s)로 3채널 원파형을 어떻게 PC에서 볼 것인가?<\/p>\n<p><strong>A. 소리가 났을 때만 보낸다.<\/strong> 프레임 RMS가 적응 문턱(잡음 바닥 × 4)을 넘으면 직전 + 트리거 프레임(40.96 ms)을 CRC 패킷으로 TX DMA 송신해 3채널 파형과 스펙트럼을 확인했다. 대가: 약 59 dB/s보다 천천히 커지는 소리는 못 잡는다.<\/p>\n<h2>최종 목표와의 연결<\/h2>\n<ul>\n<li>G1: PC에서 같은 원파형으로 다시 계산하는 정답지(Python) 방식의 입력을 만든다 (<a href=\"../decision.html#D2-4\">D2-4<\/a>).<\/li>\n<li>G4: 패킷·CRC·TX DMA 구조가 이후 STREAM 패킷의 바탕이다.<\/li>\n<\/ul>\n<h2>통과 기준 (확정일 기록 없음 — 원문 \"이 단계의 목표\"를 사후에 옮김)<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>기준<\/th>\n<th>측정 조건<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>원파형 수신<\/td>\n<td>트리거 프레임 + 직전 프레임, CRC 오류 0<\/td>\n<td><code>dump_viewer.py<\/code> 콘솔 카운터<\/td>\n<\/tr>\n<tr>\n<td>3채널 확인<\/td>\n<td>클리핑·게인 균형·도달 시간차를 눈으로 확인<\/td>\n<td>그래프 3단<\/td>\n<\/tr>\n<tr>\n<td>정답지 입력<\/td>\n<td>npz 저장<\/td>\n<td><code>dumps/<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>결과<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>실측<\/th>\n<th>판정<\/th>\n<th>날짜<\/th>\n<th>근거<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>패킷 수신<\/td>\n<td>덤프 수신·그래프 확인 (패킷 12,310 B, 전송 약 134 ms는 계산값)<\/td>\n<td>통과<\/td>\n<td>2026-10-08<\/td>\n<td><a href=\"../reports/step2/dump_plot.png\">dump_plot<\/a><\/td>\n<\/tr>\n<tr>\n<td>캡처 seq 22<\/td>\n<td>클리핑 0, p2p 430 / 985 / 511, rms 29 / 63 / 31 (MIC2 약 +6 dB)<\/td>\n<td>확인<\/td>\n<td>2026-10-08<\/td>\n<td><a href=\"logs/Step2.md\">logs/Step2.md<\/a><\/td>\n<\/tr>\n<tr>\n<td>스펙트럼<\/td>\n<td>에너지 대부분 2 ~ 6 kHz, 150 ~ 2000 Hz는 −60 ~ −70 dBFS<\/td>\n<td>확인<\/td>\n<td>2026-10-08<\/td>\n<td>logs/Step2.md<\/td>\n<\/tr>\n<tr>\n<td>서서히 커지는 소리<\/td>\n<td>약 59 dB/s 미만 상승은 트리거 안 됨 (시뮬레이션)<\/td>\n<td>한계<\/td>\n<td>2026-10-10<\/td>\n<td>logs/Step2.md<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>파라미터<\/h2>\n<tab td>\n<td>21<\/td>\n<td>표본 부족 (≥ 30)<\/td>\n<td>—<\/td>\n<td>Step6<\/td>\n<\/tr>\n<tr>\n<td>장치 경로 FPV 창 재현율<\/td>\n<td>0.05<\/td>\n<td>기록<\/td>\n<td>2026-10-19<\/td>\n<td>logs/Step8.md<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>버전별 경과는 <a href=\"logs/Step8.md\">logs/Step8.md<\/a>, 재현 명령은 <a href=\"../docs/run.md\">docs/run.md<\/a>.<\/p>\n<h2>파라미터<\/h2>\n<table>\n<thead>\n<tr>\n<th>이름<\/th>\n<th>현재 값<\/th>\n<th>근거<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>입력<\/td>\n<td>원음 → 50 kHz → 장치 FIR·↓4 → 16 kHz, 1 s 창 / 0.5 s 이동, RMS −30 dBFS<\/td>\n<td>MCU와 같은 대역<\/td>\n<\/tr>\n<tr>\n<td>모델<\/td>\n<td>PANNs CNN14 (16 kHz판) 임베딩 2048 + 로지스틱 회귀 <code>C=0.05<\/code>, 클래스 균형<\/td>\n<td><a href=\"../decision.html#D8-1\">D8-1<\/a><\/td>\n<\/tr>\n<tr>\n<td>문턱<\/td>\n<td>비드론 창 오탐 0.5% (교차검증)<\/td>\n<td>D8-5 (시험 결과를 보고 고른 값)<\/td>\n<\/tr>\n<tr>\n<td>지속 확인<\/td>\n<td>3창 중 2창<\/td>\n<td>Step6<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>남은 일<\/h2>\n<ul>\n<li>[x] v5 장치 경로 녹음·평가: 장치 FPV 0.07 (기준 &gt; 0.12 미달), 장치 창 오탐 4.2% (기준 ≤ 1% 미달). <a href=\"logs/Step8.md\">logs/Step8.md<\/a><\/li>\n<li>[x] 장치 경로 오탐 원인 진단 (D8-7): 보드 잡음이 아니라 녹음 날 배경음(60 Hz 험 + 130 ~ 185 Hz)이 조용한 창에서 드론으로 판정됨 (스피커 쉴 때도 39%). <a href=\"logs/Step8.md\">logs/Step8.md<\/a><\/li>\n<li>[x] 배경음 오탐 대책: 조용한 창 규칙을 <a href=\"Step8b.md\">Step8b<\/a>로 옮김 (D8-8)<\/li>\n<li>이 아래 할 일은 학습 동결(D8-9)로 멈춤. 실기 확보 시 재개<\/li>\n<li>[ ] 문턱 0.5%를 새 시험 데이터로 다시 확인 (1·0.5·0.2·0.1% 중 시험 결과를 보고 고름)<\/li>\n<li>[ ] Matrice 300 통과 비행 놓침 (사건 검출 81%의 원인 4건)<\/li>\n<li>[ ] FPV를 가까이 와서야 잡는 문제<\/li>\n<li>[ ] 거짓 검출 총·최장 지속시간 기록, 독립 최종 시험에서 고정 설정으로 재평가<\/li>\n<\/ul>\n<h2>관련 결정<\/h2>\n<ul>\n<li>D8-1 ~ D8-6, DO-2 (decision.html)<\/li>\n<\/ul>", "file": "Steps/Step8.md", "level": 6}, {"id": "Step8b", "title": "고조파 센서 B0 (학습 없는 기준선)", "depends_on": ["Step5", "Step6"], "goal_ref": ["G2", "I2", "I5"], "exit": "공개 원음 5-fold에서 사건 검출 ≥ 90%, FPV 창 재현율 ≥ 0.5, 장치 경로(speaker_10min) FPV 창 재현율 ≥ 0.5. 오탐은 상한 없이 기록하고 동결한 학습 모델(v3m)과 비교", "on_fail": "Step8", "status": {"impl": "진행"}, "body": "<h2>질문과 답<\/h2>\n<p><strong>Q.<\/strong> 학습 없이 DSP(고조파 점수)만으로, 정밀도는 낮아도 재현율이 높은 \"드론 후보\" 센서를 만들 수 있는가? 특히 학습이 무너진 장치 경로에서도 FPV를 잡는가?<\/p>\n<p><strong>A. 재현율은 예, 정밀도는 아니오.<\/strong> 사건 21/21, FPV 창 재현율 1.00, 장치 경로 FPV 0.68 (조용한 창 규칙 없이 1.00)로 세 기준을 넘었다. 대신 ESC-50 비드론 클립의 66%(1311클립, 502회/시간)와 선풍기 창 100%를 드론 후보로 낸다 — 비드론을 거의 거르지 못한다.<\/p>\n<h2>최종 목표와의 연결<\/h2>\n<ul>\n<li>G2: 실기가 없어 학습의 효과를 확인할 수 없다 (<a href=\"../decision.html#D8-9\">D8-9<\/a>). 장치 경로에 덜 흔들리는 DSP 센서를 기준선으로 두고, 이후 판별은 이 센서 위에 얹는다.<\/li>\n<li>I2: 학습은 없지만 문턱은 시험에 쓰지 않는 fold로만 정한다.<\/li>\n<li>I5: 결과는 모두 재생음 조건이다.<\/li>\n<\/ul>\n<h2>통과 기준 (2026-10-25 확정)<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>기준<\/th>\n<th>측정 조건<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>사건 검출<\/td>\n<td>≥ 90% (21사건, 3창 중 2창)<\/td>\n<td>공개 원음 5-fold, 기본음 후보 40 ~ 700 Hz<\/td>\n<\/tr>\n<tr>\n<td>FPV 창 재현율<\/td>\n<td>≥ 0.5<\/td>\n<td>공개 원음 fold 1 (DJI FPV)<\/td>\n<\/tr>\n<tr>\n<td>장치 경로 FPV 창 재현율<\/td>\n<td>≥ 0.5<\/td>\n<td>speaker_10min FPV 구간<\/td>\n<\/tr>\n<tr>\n<td>오탐<\/td>\n<td>상한 없음, 기록<\/td>\n<td>공개 ESC-50 오탐/시간, 장치 경로 ESC 창 오탐률, 배경 창 (quiet·선풍기·에어컨·devpath 재생 전후)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>점수: 1 s 창 안의 164 ms 프레임마다, 기본음 후보 f0의 고조파 1 ~ 4번 자리에서 이웃 주파수 중앙값 대비 SNR을 더한 S(f0)를 프레임 평균한 뒤 f0 중 최댓값. 프레임 크기·SNR 바닥 방식은 Step5 <code>harmonic_survey<\/code>·<code>f0_probe<\/code>와 같다.<\/li>\n<li>문턱: fold k를 시험할 때 나머지 4개 fold의 드론 창 재현율이 0.9가 되는 점수.<\/li>\n<li>조용한 창: 장치 녹음에서는 보드 잡음 바닥 대비 6 dB 미만 창을 \"없음\"으로 둔다 (<a href=\"../decision.html#D8-8\">D8-8<\/a>에서 옮김). 공개 원음은 녹음기마다 바닥이 달라 적용하지 않는다.<\/li>\n<li>기본음 후보 범위 FPV만(300 ~ 700 Hz)도 같이 돌려 기록한다. 판정은 40 ~ 700 Hz 기준.<\/li>\n<\/ul>\n<h3>B1 기준 (2026-10-25 확정, B1 실험 전)<\/h3>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>기준<\/th>\n<th>비교 (B0)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>장치 경로: 창 오탐률 ≤ 5%에서 FPV 창 재현율<\/td>\n<td>≥ 0.5<\/td>\n<td>0.37<\/td>\n<\/tr>\n<tr>\n<td>공개 원음: 오탐 ≤ 10회/시간에서 FPV 창 재현율<\/td>\n<td>≥ 0.2<\/td>\n<td>0.00 (v3m 0.43)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>B1 = B0 점수 + 거름 3개. 거름의 경계값은 fold마다 <strong>나머지 fold의 드론 창 95%가 통과<\/strong>하는 값으로 정한다 (시험 데이터로 고르지 않음).<\/li>\n<li>정수배 정확도: 164 ms 조각마다 고조파 봉우리 위치를 포물선 보간으로 읽고, k·f0에서 벗어난 정도(Hz)<\/li>\n<li>지속: 1 s 창 안에서 고조파가 뚜렷한 조각의 비율<\/li>\n<li>기본음 출렁임: 그 조각들의 기본음 최대 − 최소 ÷ 기본음<\/li>\n<li>머리 위 통과 때 4번째 고조파가 164 ms 안에서 약 22 Hz(3.7칸) 움직이므로, 봉우리를 찾는 범위를 차수에 비례해 넓힌다.<\/li>\n<\/ul>\n<h2>결과<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>실측<\/th>\n<th>판정<\/th>\n<th>날짜<\/th>\n<th>근거<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>사건 검출 (40 ~ 700 Hz)<\/td>\n<td>21/21<\/td>\n<td>기준 충족<\/td>\n<td>2026-10-25<\/td>\n<td><a href=\"../reports/step8b/b0_report.md\">b0_report<\/a><\/td>\n<\/tr>\n<tr>\n<td>FPV 창 재현율 (공개)<\/td>\n<td>1.00 (v3m 0.22)<\/td>\n<td>기준 충족<\/td>\n<td>2026-10-25<\/td>\n<td>b0_report<\/td>\n<\/tr>\n<tr>\n<td>장치 경로 FPV 창 재현율<\/td>\n<td>0.68, 조용한 창 규칙 없이 1.00 (v3m 0.05)<\/td>\n<td>기준 충족<\/td>\n<td>2026-10-25<\/td>\n<td>b0_report<\/td>\n<\/tr>\n<tr>\n<td>오탐: 공개 ESC-50<\/td>\n<td>502회/시간 (1311/1996 클립, v3m 0.77)<\/td>\n<td>기록<\/td>\n<td>2026-10-25<\/td>\n<td>b0_report<\/td>\n<\/tr>\n<tr>\n<td>오탐: 장치 경로 ESC 창<\/td>\n<td>57.8% (v3m 6.8%)<\/td>\n<td>기록<\/td>\n<td>2026-10-25<\/td>\n<td>b0_report<\/td>\n<\/tr>\n<tr>\n<td>오탐: 배경 창<\/td>\n<td>조용함 0%, 에어컨 0%, devpath 재생 전·후 0% (v3m 39%), <strong>선풍기 100%<\/strong><\/td>\n<td>기록<\/td>\n<td>2026-10-25<\/td>\n<td>b0_report<\/td>\n<\/tr>\n<tr>\n<td>기본음 300 ~ 700 Hz (FPV만)<\/td>\n<td>사건 21/21, 장치 FPV 0.68, 공개 오탐 550회/시간 — 좁혀도 오탐이 줄지 않음<\/td>\n<td>기록<\/td>\n<td>2026-10-25<\/td>\n<td>b0_report<\/td>\n<\/tr>\n<tr>\n<td>운용점 곡선: 공개 원음<\/td>\n<td>오탐 ≤ 10회/시간에서 FPV 재현율 B0 0.00 대 v3m 0.43, B0는 50회/시간 이상에서야 잡기 시작<\/td>\n<td>기록<\/td>\n<td>2026-10-25<\/td>\n<td><a href=\"../reports/step8b/b0_curve.md\">b0_curve<\/a><\/td>\n<\/tr>\n<tr>\n<td>운용점 곡선: 장치 경로<\/td>\n<td>창 오탐률 ≤ 10%에서 FPV 재현율 B0 0.63 대 v3m 0.11 (v3m + 조용한 창 규칙 0.34). B0는 0.66에서 멈춤 (FPV 창 약 1/3이 조용한 창)<\/td>\n<td>기록<\/td>\n<td>2026-10-25<\/td>\n<td>b0_curve<\/td>\n<\/tr>\n<tr>\n<td>오탐 범주: 공개 ESC-50<\/td>\n<td>50범주 중 46범주가 클립 오탐률 20% 초과. 점수가 드론(중앙 25.5)에 가까운 범주: 교회 종 30.6, 자동차 경적 24.2, 체인톱 22.1, 세탁기 21.7, 곤충 21.2, 소 20.8. 거의 안 걸리는 것은 비·발소리·박수·파도뿐<\/td>\n<td>기록<\/td>\n<td>2026-10-25<\/td>\n<td><a href=\"../reports/step8b/b0_fa_categories.md\">b0_fa_categories<\/a><\/td>\n<\/tr>\n<tr>\n<td>오탐 범주: 장치 경로<\/td>\n<td>비·파도·바람(잡음에 가까운 소리)이 원본 점수 7 ~ 14 → 녹음 17 ~ 22로 올라 100% 오탐. 녹음에만 299.8 · 579.2 · 884.8 · 1,170.2 Hz 선이 생김 — 보드 주기(48.828 Hz)의 배수도, 정확한 정수배도 아님 → 장치 경로(스피커·책상·방·마이크)의 공진으로 추정. 10-16 핑크 잡음 응답에도 이웃보다 6 ~ 8 dB 튀는 봉우리가 다른 위치에 있음<\/td>\n<td>기록<\/td>\n<td>2026-10-25<\/td>\n<td>b0_fa_categories<\/td>\n<\/tr>\n<tr>\n<td>B1: 장치 경로 창 오탐률 ≤ 5%에서 FPV 재현율<\/td>\n<td>0.47 (B0 0.37) — 정수배 거름이 효과 (B1-정수배만 0.45)<\/td>\n<td>미달 (≥ 0.5)<\/td>\n<td>2026-10-25<\/td>\n<td><a href=\"../reports/step8b/b1_report.md\">b1_report<\/a><\/td>\n<\/tr>\n<tr>\n<td>B1: 공개 원음 오탐 ≤ 10회/시간에서 FPV 재현율<\/td>\n<td>0.00 (B0 0.00) — 거름이 ESC 창의 43%를 걸렀지만, 점수가 가장 높은 비드론(엔진·체인톱·세탁기·종·경적)은 그대로 통과<\/td>\n<td>미달 (≥ 0.2)<\/td>\n<td>2026-10-25<\/td>\n<td>b1_report<\/td>\n<\/tr>\n<tr>\n<td>B1 거름 경계 (드론 95% 통과)<\/td>\n<td>정수배 어긋남 ≤ 6.5 ~ 6.9 Hz — 공진 가짜 선(2 ~ 7 Hz)을 다 거르기에는 느슨함. 지속 ≥ 0.55 ~ 0.64, 출렁임 ≤ 0.09<\/td>\n<td>기록<\/td>\n<td>2026-10-25<\/td>\n<td>b1_report<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>남은 일<\/h2>\n<ul>\n<li>[x] B0 점수·평가 구현 (<code>Tools/harmonic/<\/code>), 같은 시험셋에서 v3m과 비교<\/li>\n<li>[x] 운용점 곡선 (B0 대 v3m): 장치 경로는 B0, 공개 원음은 학습이 우세. 장치 경로 FPV는 1 m 재생이라 유리한 조건<\/li>\n<li>[x] B0 오탐 범주 집계: 공개는 고조파가 있는 거의 모든 소리, 장치 경로는 공진이 만든 가짜 선<\/li>\n<li>[x] B1 (정수배 정확도 · 지속 · 출렁임): 장치 경로 조금 개선, 공개 원음 개선 없음 — 고조파 구조로는 다른 회전 기계(엔진·모터)와 드론을 가르지 못함<\/li>\n<li>[x] 다음 결정 (D8-10): 방향 추적(KF 움직임 + 고도각)으로 → <a href=\"Step8c.md\">Step8c<\/a>로 옮김<\/li>\n<li>[ ] 결과에 따라 오탐을 줄이는 특징 (선 폭, 기본음 변화 속도, 지속 시간) 검토<\/li>\n<li>[ ] MCU 이식 가능성: <code>doa.c<\/code>가 이미 계산하는 블록 스펙트럼 위에서 점수 계산<\/li>\n<\/ul>\n<h2>관련 결정<\/h2>\n<ul>\n<li>D8-9, D8-8 (decision.html)<\/li>\n<\/ul>", "file": "Steps/Step8b.md", "level": 6}, {"id": "Step8c", "title": "방향 추적으로 회전 기계 감점 (추적 KF + 정지 판정 + 고도각)", "depends_on": ["Step7", "Step8b"], "goal_ref": ["G2", "G3", "I4"], "exit": "고도 0°와 20°의 norm 비율 분포(p5 ~ p95)가 겹치지 않음, 정지 판정이 고정 음원 창 95% 이상에서 |ω| ≤ 3°/s, 회전 녹음에서 박수 구간마다 KF ω 평균이 기준의 ±30% 안, 고도 20°·30° 단계의 비율 고도각이 기준의 ±10° 안, 높이 있는 정지 음원의 감점 창 ≤ 5%, 선풍기 녹음의 감점 창 ≥ 80%", "on_fail": "Step8b", "status": {"impl": "대기"}, "body": "<h2>질문과 답<\/h2>\n<p><strong>Q.<\/strong> 방위 추적으로 얻은 움직임·고도 단서가, 고조파 후보 중 고정된 지면 회전 기계의 점수를 낮추되 정면 접근·원거리 고정익(방위가 거의 안 변하는 표적)은 유지하는가?<\/p>\n<p><strong>A. 아직 모른다 — 시험 전.<\/strong><\/p>\n<h2>최종 목표와의 연결<\/h2>\n<ul>\n<li>G2: 고조파 구조로는 엔진·모터와 드론이 같은 부류다 (<a href=\"../decision.html#D8-10\">D8-10<\/a>). 움직임과 고도로 점수를 깎되 버리지는 않는다 (<a href=\"../decision.html#D8c-1\">D8c-1<\/a>).<\/li>\n<li>G3·I4: 추적 KF가 방위가 잠깐 끊기거나 튈 때 예측으로 이어 가고, 불확실성이 커지면 놓는다 (Step9A 결합의 경과 시간 규칙과 이어짐).<\/li>\n<\/ul>\n<h2>통과 기준 (2026-10-26 확정 · 10-27 대상 변경(D4-3)으로 용어만 수정, 수치 그대로)<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>기준<\/th>\n<th>측정 조건<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>고도 해상도<\/td>\n<td>고도 0°와 20°의 창별 norm 비율 분포 p5 ~ p95 구간이 겹치지 않음<\/td>\n<td>핸드폰 고도 0° · 10° · 20° · 30°, 각 30 s 이상, 0° 방향, 같은 수평 거리 l<\/td>\n<\/tr>\n<tr>\n<td>정지 판정<\/td>\n<td>고정 음원 창의 95% 이상에서 3 s 회귀 기울기 |ω| ≤ 3°/s<\/td>\n<td>Step7 12방향 녹음<\/td>\n<\/tr>\n<tr>\n<td>추적<\/td>\n<td>박수 사이 구간마다 KF ω 평균이 기준 각속도의 ±30% 안<\/td>\n<td>회전 녹음 (느리게·빠르게). 기준 = 90° ÷ 박수 사이 시간<\/td>\n<\/tr>\n<tr>\n<td>고도<\/td>\n<td>비율 고도각 arccos(norm ÷ k0)이 기준 atan(h ÷ l)의 ±10° 안 (20°·30° 단계)<\/td>\n<td>고도 녹음. k0 = 같은 방위 0° 단계의 norm 중앙값<\/td>\n<\/tr>\n<tr>\n<td>정지처럼 보이는 표적 보존<\/td>\n<td>감점된 창 ≤ 5%<\/td>\n<td>고도 20°·30° 정지 녹음 (높이 있는 정지 음원 = 원거리·정면 접근 고정익 대리)<\/td>\n<\/tr>\n<tr>\n<td>고정 기계 감점<\/td>\n<td>감점된 창 ≥ 80%<\/td>\n<td><code>fan_10min<\/code> (B0 오탐 100%)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>추적:<\/strong> 2상태 등속 KF [θ, ω], Δt = T_hop 0.246 s. Q는 가까이 지나는 표적 기준으로 크게 (<code>계산<\/code> 시속 100 km = 28 m/s, ω = v ÷ r: 100 m 앞 16°/s, 50 m 앞 32°/s). 용도 = 결측 구간 유지, 이상치 게이트(정규화 혁신 &gt; 2.58σ면 결측 처리). 혁신은 ±180°로 감아 계산. norm이 작으면(머리 위) R을 키우거나 갱신을 건너뛴다. 측정 잡음 R은 Step7 흔들림(2 ~ 4°)에서.<\/li>\n<li><strong>정지 판정:<\/strong> 추적 KF와 분리한다 (두 기준이 Q를 반대로 당김). 최근 3 s 방위에 직선을 맞춘 기울기로 본다. <code>계산<\/code> σ 3°, 0.25 s 간격이면 기울기 오차 ≈ 5.2 ÷ T^1.5 °/s → T 2.3 s, 창 50% 겹침으로 실효 표본이 절반 → 3 s.<\/li>\n<li><strong>감점:<\/strong> 정지(|ω| ≤ 3°/s) AND 고도 경계 미만 AND 3 s 이상 지속이면 B0·B1 점수 × ½. 고도 경계는 고도 해상도 시험의 0°·20° 분포 사이에서 정한 뒤 감점 시험 전에 고정한다.<\/li>\n<li><strong>고도는 비율로 본다.<\/strong> Step7에서 지연이 70 mm 기대보다 약 22% 작아 같은 높이도 고도 24 ~ 49°로 나왔다. 배율 오차는 빼기로 지워지지 않는다 (<code>계산<\/code> 배율 0.78·실제 30°: 고도각 차이 8.8°, 비율 30°). 배율이 방위마다 달라 k0는 같은 방위에서 잰다.<\/li>\n<li><strong>고정익의 움직임 단서는 거리에 따라 약해진다.<\/strong> 제자리 비행은 못 하지만 <code>계산<\/code> 28 m/s면 500 m 앞 3.2°/s, 1 km 앞 1.6°/s, 3 km 앞 0.5°/s → 500 m 밖에서는 정지 기준 3°/s 근처·아래라 고도 단서에 기댄다. 머리 위(고도 60° 이상)는 norm이 작아 방위가 불안정하다 (Step7 합성: 60°에서 유효 54%).<\/li>\n<li><strong>한계:<\/strong> 멀고 낮은(고도 20° 아래) 표적은 감점된다 (<code>계산<\/code> cos 10° = 0.985, cos 20° = 0.940). 지나가는 차(15 m 앞 15 m/s ≈ 57°/s)는 움직임만으로 기체와 같아 고도에 기댄다. 지금 시험 장치에서는 실제 기체의 움직임이 없다.<\/li>\n<li>회전 녹음 각속도: 한 바퀴 30 s면 12°/s, 10 s면 36°/s → 0.5 s 창 안 번짐 6 ~ 18°. 결측이 많으면 KF 문제인지 측정 번짐인지 먼저 가른다.<\/li>\n<\/ul>\n<h2>결과<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>실측<\/th>\n<th>판정<\/th>\n<th>날짜<\/th>\n<th>근거<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>고도 해상도<\/td>\n<td>—<\/td>\n<td>미측정<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>정지 판정<\/td>\n<td>—<\/td>\n<td>미측정<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>남은 일<\/h2>\n<ul>\n<li>[ ] 고도 해상도 녹음·분석 (사용자 녹음, <a href=\"../docs/run.md\">docs/run.md<\/a>). 실패하면 고도 단서를 쓰는 규칙 전체를 재검토 (D8c-1 다시 볼 조건)<\/li>\n<li>[ ] 기존 데이터로 정지 판정 확인: <code>fan_10min<\/code>(감점 대상), Step7 12방향(고정 음원)<\/li>\n<li>[ ] 추적 KF(2상태) Python 구현 + 회전 녹음으로 ω 확인<\/li>\n<li>[ ] 감점 규칙을 B0·B1 곡선과 같은 방식으로 비교<\/li>\n<li>[ ] MCU 이식 (2상태 KF + 3 s 회귀, 연산 작음)<\/li>\n<\/ul>\n<h2>관련 결정<\/h2>\n<ul>\n<li>D8-10, D8c-1 (decision.htm 기 전 20.48 ms 이내 확보<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>분류 경로<\/td>\n<td>100 ms 갱신 구성이면 관측 최악 시간 &lt; 100 ms, 큐 비누적<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>PC 대비<\/td>\n<td>유효 방향 차이 ≤ 1°, 검출 사건 판정 일치, 출력 갱신 간격 이내 타이밍 차이<\/td>\n<td>동일 저장 입력<\/td>\n<\/tr>\n<tr>\n<td>고장 주입<\/td>\n<td>통신 단절·CRC 오류·클리핑 → 감지·무효화·복귀<\/td>\n<td>별도 시험<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>결과<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>실측<\/th>\n<th>판정<\/th>\n<th>날짜<\/th>\n<th>근거<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>STM32 쪽 방향 결과 패킷<\/td>\n<td>STREAM 모드에서 PCM과 함께 약 0.25 s마다 type 0x04<\/td>\n<td>완료 (일부)<\/td>\n<td>2026-10-18<\/td>\n<td><a href=\"Step7.md\">Step7<\/a><\/td>\n<\/tr>\n<tr>\n<td>30분 운용<\/td>\n<td>—<\/td>\n<td>미측정<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>남은 일<\/h2>\n<ul>\n<li>[ ] 기본 배치: STM32 수음·CMSIS 전처리·방향, PC 학습 추론. 결과를 구간 번호와 함께 전달해 상태 결합<\/li>\n<li>[ ] 모듈 연결, 큐·버퍼 수명, 처리 시간·메모리·결과 경과 시간 측정, 검출 상태와 오류 복귀<\/li>\n<li>[ ] ADC 콜백(프레임) 주기의 흔들림 측정: DWT 차이 최소/최대 (기대 3,686,400 cycles) (Step1·3에서 이월)<\/li>\n<li>[ ] UART 여유가 약 17%뿐. qdrop이 생기면 보율 상향(ST-LINK 가상 COM 지원 값 실측) 또는 2프레임 묶음 패킷 (Step5에서 이월)<\/li>\n<li>[ ] PC 수신 CRC 오류 1회씩(보드 카운터 0)이 <code>mcu_doa2<\/code>·doa_bg·az090·az240에서 있었음 → 장시간 운용에서 따로 확인 (Step7에서 이월)<\/li>\n<li>[ ] 정상 운용과 별도로 통신 단절·CRC 오류·클리핑 주입 시험<\/li>\n<li>[ ] 카메라·서보 구동 지연만큼 앞당긴 방위 출력: Step8c 추적 KF의 예측을 \"현재 + 구동 지연\" 시점으로 낸다 (D8c-1, Step8c 범위 밖)<\/li>\n<li>[ ] 실제 PC 추론 지연(분류 창 끝 → 결과 도착)의 최악값을 재고 Step9A <code>CLS_MAX_AGE<\/code>(1.0 s)를 다시 정한다. 최악 지연 + 창 이동 0.5 s보다 작으면 출력이 계속 \"판단 불가\"가 된다 (D9A-1, Step9A에서 옮김)<\/li>\n<\/ul>\n<h2>관련 결정<\/h2>\n<ul>\n<li>D4.5-3, D7-3 (decision.html)<\/li>\n<\/ul>", "file": "Steps/Step10.md", "level": 8}, {"id": "Step11", "title": "(조건부) 실제 FPV 검출·방위 최종 검증", "depends_on": ["Step10"], "goal_ref": ["G5", "I5"], "exit": "실제 비행 독립 사건 ≥ 30건, 현장 비드론 별도 녹음 ≥ 2시간에서 Step8의 검출률·오탐·지연 기준과 Step7의 오차·유효율 기준 충족. 시험 결과를 보고 튜닝했다면 새 독립 시험으로 재평가", "on_fail": null, "status": {"impl": "대기"}, "body": "<h2>질문과 답<\/h2>\n<p><strong>Q.<\/strong> 재생음에서 만든 시스템이 실제 비행에서도 작동하는가?<\/p>\n<p><strong>A. 아직 모른다 — 실기가 없어 시작 조건이 안 된다.<\/strong> 그때까지 모든 결과는 재생음 조건이다.<\/p>\n<h2>최종 목표와의 연결<\/h2>\n<ul>\n<li>G5: 실제 FPV 성능을 주장하려면 이 Step을 통과해야 한다. 실기 확보 전에는 재생음 조건의 결과로만 표시한다.<\/li>\n<li>I5: 재생음 결과를 실제 비행으로 확대하지 않는다.<\/li>\n<\/ul>\n<h2>통과 기준 (상세 계획 v1.0, 2026-10-15 확정)<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>기준<\/th>\n<th>측정 조건<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>실제 비행 표본<\/td>\n<td>독립 사건 ≥ 30<\/td>\n<td>학습·튜닝에 쓰지 않은 비행<\/td>\n<\/tr>\n<tr>\n<td>현장 비드론<\/td>\n<td>별도 녹음 ≥ 2시간<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>검출 / 방위<\/td>\n<td>Step8 / Step7 기준 충족<\/td>\n<td>평가 거리는 시험 전 고정 (5·10·20 m는 예시)<\/td>\n<\/tr>\n<tr>\n<td>혼합음<\/td>\n<td>대응을 주장한다면 실제 운용 시험에서도 Step9B 지표 확인<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>정답 측정 오차가 목표 각도 오차보다 크면 해당 조건의 정확도 통과를 판정하지 않는다.<\/p>\n<h2>결과<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>실측<\/th>\n<th>판정<\/th>\n<th>날짜<\/th>\n<th>근거<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>실제 비행<\/td>\n<td>—<\/td>\n<td>미측정 (실기 없음)<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>남은 일<\/h2>\n<ul>\n<li>[ ] 실기와 독립 정답 자료(영상 또는 위치 로그) 확보 — 확보 전에는 시작하지 않는다<\/li>\n<li>[ ] 모델·임계값·배열·전처리 설정 고정, 거리·방위·높이·바람·기체 종류 기록, 정답과 음향의 시간 대응 오차 측정<\/li>\n<li>[ ] 거리별 결과 계산 (먼 미탐 구간을 임의로 제외하지 않음), 소리 전파 지연 보정 여부를 평가 규칙에 명시<\/li>\n<li>실패 시: 분류 → Step8, 각도 → Step7, 잘못된 음원 선택 → Step9A·9B, 운용 중 유실·지연 → Step10<\/li>\n<\/ul>\n<h2>관련 결정<\/h2>\n<ul>\n<li>D4.5-1 (decision.html)<\/li>\n<\/ul>", "file": "Steps/Step11.md", "level": 9}, {"id": "Step9B", "title": "혼합음 한계 평가", "depends_on": ["Step10"], "goal_ref": ["G3", "I5"], "exit": "첫 완성: 시험 조건·성공/실패·지원하지 못하는 조건을 기록. 혼합음 대응을 주장할 때: 지정 필수 조건별 공동 성공률 ≥ 80%, 발행한 유효 출력 중 방해음 오지향률 ≤ 5% (허용각 시험 전 고정, 초기 ±10°)", "on_fail": null, "status": {"impl": "대기"}, "body": "<h2>질문과 답<\/h2>\n<p><strong>Q.<\/strong> 드론을 검출했지만 팬 방향을 출력하는 상황은 언제 발생하는가?<\/p>\n<p><strong>A. 아직 모른다 — 시험 전.<\/strong> 단일 음원 결합(Step9A)과 통합(Step10)이 먼저다.<\/p>\n<h2>최종 목표와의 연결<\/h2>\n<ul>\n<li>G3: 단일 음원에서 통과한 결합이 방해음이 있을 때 어디까지 버티는지 기록한다.<\/li>\n<li>I5: 실패한 혼합음 성능을 단일 음원 통과로 대체하지 않는다.<\/li>\n<\/ul>\n<h2>통과 기준 (Roadmap 4.5.2 v0.4, 2026-10-15 확정)<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>기준<\/th>\n<th>측정 조건<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>첫 완성에 필요<\/td>\n<td>시험 조건·성공/실패·미지원 조건 기록<\/td>\n<td>드론 재생음 + 다른 방향 팬<\/td>\n<\/tr>\n<tr>\n<td>혼합음 대응 주장 시<\/td>\n<td>공동 성공률 ≥ 80%, 방해음 오지향률 ≤ 5%. 무효·보류는 실패로 계산<\/td>\n<td>각도 차 ≥ 60°, 목표음 우세·비슷·팬 우세<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>결과<\/h2>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>실측<\/th>\n<th>판정<\/th>\n<th>날짜<\/th>\n<th>근거<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>혼합음 시험<\/td>\n<td>—<\/td>\n<td>미측정<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>남은 일<\/h2>\n<ul>\n<li>[ ] 각도 차 ≥ 60°에서 목표음 우세·비슷한 레벨·팬 우세 조건을 정하고 기준 마이크의 대역 에너지비 기록<\/li>\n<li>[ ] 같은 평가 시점으로 공동 성공률·방해음 오지향률·보류율 계산<\/li>\n<li>[ ] 음성·음악 등으로 확장할지는 오류와 목표 환경을 보고 정한다<\/li>\n<li>실패 즉시 방향별 빔포밍·분류, SRP-PHAT 또는 배열 변경을 의무화하지 않는다 (자동 확장 금지)<\/li>\n<\/ul>\n<h2>관련 결정<\/h2>\n<ul>\n<li>(없음)<\/li>\n<\/ul>", "file": "Steps/Step9B.md", "level": 9}]}</script>
<script>
(() => {
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byId = Object.fromEntries(D.steps.map(s => [s.id, s]));
let focus = null, selected = null;

$('#ttl').textContent = D.project + ' · Step 흐름';

// 범례: 목표·우선순위·불변조건 칩. 누르면 그 항목에 기여하는 Step만 강조.
const legend = $('#legend');
legend.innerHTML = '<span class="label">기여 필터</span>';
for (const [k, v] of Object.entries(D.refs)) {
  const n = D.steps.filter(s => s.goal_ref.includes(k)).length;
  const b = document.createElement('button');
  b.className = 'chip ' + k[0];
  b.title = v.text;
  b.innerHTML = `<b>${esc(k)}</b> ${esc(v.text)} ${n ? `· ${n}` : ('GI'.includes(k[0]) ? '<span class="warn">· 0 ⚠ 검증 Step 없음</span>' : '· 0')}`;
  b.onclick = () => { focus = focus === k ? null : k; apply(); };
  b.dataset.ref = k;
  legend.appendChild(b);
}

// 카드
const lanes = $('#lanes');
const maxL = Math.max(...D.steps.map(s => s.level));
for (let l = 0; l <= maxL; l++) {
  const lane = document.createElement('div');
  const items = D.steps.filter(s => s.level === l);
  lane.className = 'lane' + (items.length > 1 ? ' multi' : '');
  for (const s of items) {
    const c = document.createElement('button');
    c.className = 'card';
    c.id = 'c-' + s.id;
    c.innerHTML = `
      <div class="top"><span class="id">${esc(s.id)}</span></div>
      <div class="title">${esc(s.title)}</div>
      <div class="exit">${esc(s.exit)}</div>
      <div class="refs">${s.goal_ref.map(r => `<span class="chip ${r[0]}" title="${esc(D.refs[r].text)}">${esc(r)}</span>`).join('')}</div>
      <div class="status"><span class="pill ${esc(s.status.impl)}">구현 ${esc(s.status.impl)}</span></div>`;
    c.onclick = () => openStep(s.id);
    lane.appendChild(c);
  }
  lanes.appendChild(lane);
}

// 화살표
const svg = $('#edges'), board = $('#board');
const NS = 'http://www.w3.org/2000/svg';
const vertical = () => matchMedia('(max-width: 760px)').matches;
function box(id) {
  const r = document.getElementById('c-' + id).getBoundingClientRect(), b = board.getBoundingClientRect();
  const x = r.left - b.left + board.scrollLeft, y = r.top - b.top + board.scrollTop;
  return { l: x, r: x + r.width, t: y, b: y + r.height, cx: x + r.width / 2, cy: y + r.height / 2 };
}
function draw() {
  svg.setAttribute('width', board.scrollWidth);
  svg.setAttribute('height', board.scrollHeight);
  svg.innerHTML = `<defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--edge)"/></marker>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fail)"/></marker></defs>`;
  const v = vertical();
  let failIdx = 0;
  for (const s of D.steps) {
    const B = box(s.id);
    for (const d of s.depends_on) {
      const A = box(d);
      let p;
      if (v) { const k = (B.t - A.b) / 2; p = `M${A.cx},${A.b} C${A.cx},${A.b + k} ${B.cx},${B.t - k} ${B.cx},${B.t - 2}`; }
      else   { const k = (B.l - A.r) / 2; p = `M${A.r},${A.cy} C${A.r + k},${A.cy} ${B.l - k},${B.cy} ${B.l - 2},${B.cy}`; }
      add('e', p, 'ah', [d, s.id]);
    }
    if (s.on_fail) {
      const A = box(s.on_fail);
      const tEl = document.getElementById('c-' + s.on_fail);
      const firstInLane = tEl === tEl.parentElement.firstElementChild;
      const lastInLane = tEl === tEl.parentElement.lastElementChild;
      let p, lx, ly;
      if (v && !firstInLane && lastInLane) {
        const x = Math.max(A.r, B.r) + 12 + 9 * (failIdx++ % 2);
        p = `M${B.r},${B.cy} C${x},${B.cy} ${x},${A.cy} ${A.r + 2},${A.cy}`;
      } else if (v) {
        const x = Math.min(A.l, B.l) - 12 - 9 * (failIdx++ % 3);
        p = `M${B.l},${B.cy} C${x},${B.cy} ${x},${A.cy} ${A.l - 2},${A.cy}`;
      } else if (firstInLane) {
        const y = Math.min(A.t, B.t) - 44;
        p = `M${B.cx},${B.t} C${B.cx},${y} ${A.cx},${y} ${A.cx},${A.t - 2}`;
        lx = (A.cx + B.cx) / 2; ly = y + 8;
      } else {
        const y = Math.max(A.b, B.b) + 44;
        p = `M${B.cx},${B.b} C${B.cx},${y} ${A.cx},${y} ${A.cx},${A.b + 2}`;
        lx = (A.cx + B.cx) / 2; ly = y - 2;
      }
      add('f', p, 'af', [s.id, s.on_fail]);
      if (v) continue;
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('class', 'fl'); t.setAttribute('x', lx); t.setAttribute('y', ly);
      t.setAttribute('text-anchor', 'middle');
      t.textContent = '미달 시';
      t.dataset.ends = s.id + ',' + s.on_fail;
      svg.appendChild(t);
    }
  }
  apply();
}
function add(cls, d, marker, ends) {
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('class', cls); p.setAttribute('d', d); p.setAttribute('marker-end', `url(#${marker})`);
  p.dataset.ends = ends.join(',');
  svg.appendChild(p);
}

// 강조 상태
function apply() {
  const hit = id => !focus || byId[id].goal_ref.includes(focus);
  for (const s of D.steps) {
    const c = document.getElementById('c-' + s.id);
    c.classList.toggle('dim', !hit(s.id));
    c.classList.toggle('sel', selected === s.id);
  }
  svg.querySelectorAll('[data-ends]').forEach(e => {
    const [a, b] = e.dataset.ends.split(',');
    e.classList.toggle('dimE', !(hit(a) && hit(b)));
  });
  legend.querySelectorAll('[data-ref]').forEach(b => b.classList.toggle('on', b.dataset.ref === focus));
}

// 패널
const panel = $('#panel'), scrim = $('#scrim');
function show(id, title, html) {
  $('#pId').textContent = id; $('#pTitle').textContent = title; $('#pBody').innerHTML = html;
  $('#pBody').scrollTop = 0;
  panel.classList.add('open'); scrim.classList.add('open'); panel.setAttribute('aria-hidden', 'false');
}
function hide() {
  panel.classList.remove('open'); scrim.classList.remove('open'); panel.setAttribute('aria-hidden', 'true');
  selected = null; apply();
}
const link = id => `<a href="#" data-go="${esc(id)}">${esc(id)}</a>`;
function openStep(id) {
  const s = byId[id]; selected = id; apply();
  const refs = s.goal_ref.map(r => `<span class="chip ${r[0]}" style="cursor:default">${esc(r)} ${esc(D.refs[r].text)}</span>`).join(' ');
  const after = D.steps.filter(x => x.depends_on.includes(id)).map(x => link(x.id)).join(', ') || '—';
  show(s.id, s.title, `
    <dl class="meta">
      <dt>통과 기준</dt><dd>${esc(s.exit)}</dd>
      <dt>기여</dt><dd>${refs}</dd>
      <dt>선행</dt><dd>${s.depends_on.map(link).join(', ') || '—'}</dd>
      <dt>다음</dt><dd>${after}</dd>
      <dt>미달 시</dt><dd>${s.on_fail ? link(s.on_fail) : '—'}</dd>
      <dt>상태</dt><dd>구현 ${esc(s.status.impl)}</dd>
    </dl>
    <div class="src">원본 문서: <a href="${esc(s.file)}">${esc(s.file)}</a></div>
    <div class="md">${s.body}</div>`);
}
$('#pBody').addEventListener('click', e => {
  const a = e.target.closest('[data-go]');
  if (a) { e.preventDefault(); openStep(a.dataset.go); document.getElementById('c-' + a.dataset.go).scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' }); }
});
$('#openProblem').onclick = () => {
  const rows = Object.entries(D.refs).map(([k, v]) => {
    const who = D.steps.filter(s => s.goal_ref.includes(k)).map(s => link(s.id)).join(', ') || '<span style="color:var(--bad)">없음 ⚠</span>';
    return `<tr><td><b>${esc(k)}</b></td><td>${esc(v.text)}</td><td>${who}</td></tr>`;
  }).join('');
  show('problem.md', '문제 정의', `
    <div class="md"><table><thead><tr><th>ID</th><th>내용</th><th>기여 Step</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="src">원본 문서: <a href="problem.md">problem.md</a></div>
    <div class="md">${D.problem_body}</div>`);
};
$('#close').onclick = hide; scrim.onclick = hide;
addEventListener('keydown', e => { if (e.key === 'Escape') hide(); });

let raf;
const redraw = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); };
addEventListener('resize', redraw);
new ResizeObserver(redraw).observe(lanes);
if (document.fonts) document.fonts.ready.then(redraw);
draw();
})();
</script>
</body>
</html>
